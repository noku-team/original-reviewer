name: "new_release"

on:
  workflow_dispatch:
    inputs:
      increment:
        description: "Version bump (auto = from conventional commits)"
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/noku-team/original-reviewer
  K8S_NAME: original-reviewer
  AWS_REGION: eu-central-2
  EKS_CLUSTER_NAME: original-ch-zh-k8s

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: git config
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Release
        run: bun run release -- --ci ${{ inputs.increment != 'auto' && inputs.increment || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: get_version
        run: echo "version=$(cat .CI_VERSION)" >> $GITHUB_OUTPUT

  push_to_registry:
    needs: release
    if: ${{ needs.release.outputs.version }}
    runs-on: ubuntu-latest
    name: Push Docker image to GHCR
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ needs.release.outputs.version }}, ${{ env.IMAGE }}:latest

  deploy:
    needs: [release, push_to_registry]
    if: ${{ needs.release.outputs.version }}
    name: "Deploy on EKS"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Secret, so the account ID is masked in public run logs
      ECR_IMAGE: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.eu-central-2.amazonaws.com/github/noku-team/original-reviewer
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-original-reviewer
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.33.0

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

      - name: Set Image
        run: |
          kubectl set image deployment/$K8S_NAME-deployment $K8S_NAME=$ECR_IMAGE:${{ needs.release.outputs.version }} -n $K8S_NAME --as=system:serviceaccount:$K8S_NAME:github-actions-deployer

      - name: Check Deployment Status
        run: kubectl rollout status deployment/$K8S_NAME-deployment -n $K8S_NAME --timeout=300s
